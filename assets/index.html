<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="idx.title">XGO Duck</title><link rel="stylesheet" href="style.css?v=20261023">
<main><header><div><small>ARDUINO UNO Q</small><h1>XGO Duck</h1></div><div class="header-actions"><nav class="nav"><a href="/" aria-current="page" data-i18n="common.nav.control">控制</a><a href="/calibrate.html" data-i18n="common.nav.calibrate">标定</a><a href="/servo.html" data-i18n="common.nav.servo">舵机设置</a></nav><button id="lang-toggle" class="lang" type="button">EN</button><button class="stop" id="stop" data-i18n="common.torque_off">卸力</button></div></header>
<p id="message" data-i18n="idx.msg.connecting">正在连接…</p>
<section class="metrics"><article><small data-i18n="idx.metrics.feedback">反馈频率</small><strong id="rx">—</strong></article><article><small data-i18n="idx.metrics.policy">策略频率</small><strong id="rl">—</strong></article><article><small data-i18n="idx.metrics.servos">舵机在线</small><strong id="servos">—</strong></article><article><small data-i18n="idx.metrics.imu">IMU</small><strong id="imu">—</strong></article></section>
<section><h2><span data-i18n="idx.mode.title">模式</span> <span id="mode">—</span></h2><div class="buttons"><button data-mode="shadow" data-i18n="idx.mode.shadow">仅推理</button><button data-mode="hold" data-i18n="idx.mode.hold">默认姿势</button><button data-mode="policy" data-i18n="idx.mode.policy">行走 / 起身</button><button id="pick" data-i18n="idx.mode.pick">抓取</button><button id="roulade" data-i18n="idx.mode.roulade">翻滚</button><button id="sitstand" disabled data-i18n="idx.mode.sit">坐下</button><button id="left_kick" disabled data-i18n="idx.mode.left_kick">左脚踢</button><button id="right_kick" disabled data-i18n="idx.mode.right_kick">右脚踢</button><label class="mode-toggle"><input id="roller-mode" type="checkbox" role="switch"> <span data-i18n="idx.mode.roller">Roller 模式</span> <span id="roller-state" data-i18n="idx.mode.off">关</span></label></div><p class="hint" data-i18n="idx.hint.mode"></p></section>
<section><h2><span data-i18n="idx.recovery.title">行走与恢复</span> <span id="recovery-phase">—</span></h2><div class="controls"><article><small data-i18n="idx.recovery.model">当前模型</small><p id="active-model">—</p></article><article><small data-i18n="idx.recovery.tilt">相对 (0, 0, -1) 的倾角</small><p id="tilt-angle">—</p></article><article><small data-i18n="idx.recovery.timer">状态计时</small><p id="recovery-timer">—</p></article></div><p class="hint" data-i18n="idx.recovery.hint"></p></section>
<section><h2 data-i18n="idx.motion.title">运动</h2><p id="roller-warning" class="warn" role="note" hidden data-i18n-html="idx.motion.warning"></p><div class="joysticks"><div class="joystick-side"><label id="left-label" data-i18n="idx.motion.left">前后 / 横移</label><div class="joy" id="joy-left" role="group" aria-labelledby="left-label"><div class="knob"></div></div><p class="joy-value">vx <span id="vxValue">0.00</span> · vy <span id="vyValue">0.00</span></p></div><div class="joystick-side"><label id="right-label" data-i18n="idx.motion.right">偏航</label><div class="joy" id="joy-right" role="group" aria-labelledby="right-label"><div class="knob"></div></div><p class="joy-value">ωz <span id="wzValue">0.00</span></p></div></div><button id="zero" data-i18n="idx.motion.zero">停止运动</button><p class="hint" data-i18n-html="idx.motion.hint"></p></section>
<section><h2 data-i18n="idx.head.title">头部与嘴</h2><div class="controls" id="head-controls"></div><p class="hint" data-i18n="idx.head.hint"></p></section>
<section><h2><span data-i18n="idx.action.title">动作设置</span> · <span id="action-profile" data-i18n="idx.action.profile_walk">普通行走 / 其他模型</span></h2><div class="controls"><label><span data-i18n="idx.action.scale">动作幅度</span> <span id="action-scale-value">1.00</span><input id="action-scale" type="range" min="0" max="2" value="1" step="0.05"></label><label><span data-i18n="idx.action.leg">腿部 α</span> <span id="leg-alpha-value">0.35</span><input id="leg-alpha" type="range" min="0" max="0.95" value="0.35" step="0.05"></label><label><span data-i18n="idx.action.head">头部 α</span> <span id="head-alpha-value">0.45</span><input id="head-alpha" type="range" min="0" max="0.95" value="0.45" step="0.05"></label></div><p class="hint" data-i18n="idx.action.hint"></p></section>
<section><h2 data-i18n="idx.imu.title">IMU 滤波</h2><div class="controls"><label><span data-i18n="idx.imu.gyro">角速度 α</span> <span id="gyro-alpha-value">0.50</span><input id="gyro-alpha" type="range" min="0" max="0.95" value="0.5" step="0.05"></label><label><span data-i18n="idx.imu.tau">重力投影 τ (s)</span> <span id="gravity-tau-value">0.30</span><input id="gravity-tau" type="range" min="0.01" max="2" value="0.3" step="0.01"></label></div><p class="hint" data-i18n="idx.imu.hint"></p></section>
<section class="telemetry"><h2 data-i18n="idx.telemetry.title">IMU 与舵机</h2><div class="telemetry-grid"><div class="imu-lines"><div><b>acc</b><span id="acc-values">—</span></div><div><b>gyro</b><span id="gyro-values">—</span></div><div><b>grav</b><span id="gravity-values">—</span></div></div><div class="table"><table><thead><tr><th>ID</th><th>°</th><th data-i18n="idx.telemetry.target">目标</th></tr></thead><tbody id="joints"></tbody></table></div></div><p class="hint" id="command-health" data-i18n="idx.telemetry.waiting">等待命令回显…</p></section>
</main><script src="i18n.js?v=20261104"></script><script src="app.js?v=20261104"></script></html>

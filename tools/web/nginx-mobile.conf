# XGO Duck mobile entrance. The existing App continues to serve port 9527.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;
    proxy_http_version 1.1;
    # Preserve the browser origin for the App's protected same-origin APIs.
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # MJPEG and live microphone PCM must pass through immediately. Closing
    # the browser stream must also close upstream and release microphone use.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_client_abort off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    location = / {
        # Internal upstream mapping: the browser URL stays at / with no redirect.
        proxy_pass http://127.0.0.1:9527/mobile.html;
    }
    location / {
        proxy_pass http://127.0.0.1:9527;
    }
}
